spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

management:
  health:
    mail:
      enabled: false

groq:
  api:
    url: "mock-url"
    key: "mock-key"
    model: "mock-model"

razorpay:
  key:
    id: mock-key
    secret: mock-secret
  webhook-secret: mock-webhook-secret

gemini:
  api:
    url: mock-url
    key: mock-key

supabase:
  url: https://mock.supabase.co
  key: mock-key

app:
  oauth2:
    redirect-uri: http://localhost:5173/oauth/callback