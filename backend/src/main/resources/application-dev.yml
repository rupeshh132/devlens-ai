server:
  port: 8081

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devlens}
    driverClassName: org.postgresql.Driver
    username: ${DB_USER:${DB_USERNAME:postgres}}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      max-lifetime: 180000
      connection-timeout: 30000
      keepalive-time: 30000
      validation-timeout: 3000
      connection-test-query: SELECT 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 10
    connect-retries-interval: 2
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devlens}
    user: ${DB_USER:${DB_USERNAME:postgres}}
    password: ${DB_PASSWORD:password}

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy_github_client_id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy_github_secret}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

