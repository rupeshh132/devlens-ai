spring:
  application:
    name: devlens-api
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devlens}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      max-lifetime: 180000
      connection-timeout: 30000
      keepalive-time: 30000
      validation-timeout: 3000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:mock-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:mock-client-secret}

  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY:mock_resend_key}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

groq:
  api:
    url: "https://api.groq.com/openai/v1/chat/completions"
    key: ${GROQ_API_KEY:dummy_groq_key}
    model: "openai/gpt-oss-120b"

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:dummy_key_id}
    secret: ${RAZORPAY_KEY_SECRET:dummy_key_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dummy_webhook_secret}

supabase:
  url: ${SUPABASE_URL:dummy_supabase_url}
  key: ${SUPABASE_KEY:dummy_supabase_key}
